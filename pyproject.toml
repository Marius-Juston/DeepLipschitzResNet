[project]
name = "deep-lipschitz-resnet"
version = "0.2.0"
description = "Structured Lipschitz certificates and reproducible revision experiments"
requires-python = ">=3.12"
dependencies = [
    "einops==0.8.1",
    "matplotlib==3.10.0",
    "numpy==2.0.1",
    "pandas==2.3.2",
    "pytest==8.4.2",
    "scipy==1.16.0",
    "tabulate==0.9.0",
    "tensorboard==2.19.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test/revision"]
